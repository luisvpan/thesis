[project]
name = "vision-model"
version = "0.1.0"
description = "Training, evaluation and release pipeline for ERAE's tangible-object detector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ultralytics>=8.3.0",
  "dvc[s3]>=3.50.0",
  "dvclive>=3.45.0",
  "pyyaml>=6.0",
  "numpy>=2.0.0",
  "opencv-python>=4.9.0",
  "onnx>=1.16.0",
  "onnxslim>=0.1.40",
]

[project.optional-dependencies]
# Error analysis and attention maps (not needed to train)
analysis = ["fiftyone>=1.0.0", "grad-cam>=1.5.0"]

[project.scripts]
vm-sessions = "vision_model.sessions:main"
vm-prepare = "vision_model.prepare:main"
vm-train = "vision_model.train:main"
vm-evaluate = "vision_model.evaluate:main"
vm-export = "vision_model.export:main"
vm-live-metrics = "vision_model.live_metrics:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.7"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
