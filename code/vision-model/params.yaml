# Single source of experiment configuration. DVC tracks every key used below,
# so changing a value and running `dvc exp run` is a new, reproducible experiment.
# Rule: one change per experiment, compared against the baseline.

data:
  raw_dir: data/raw            # Roboflow export, COCO JSON format, exported WITHOUT resize
  prepared_dir: data/prepared
  session_gap_minutes: 30      # a gap larger than this starts a new capture session
  drop_classes: []             # classes to remove (e.g. typos Roboflow keeps with 0 objects)

split:
  # Whole sessions only. Run `uv run --no-sync vm-sessions` to list them.
  # Always QUOTE session ids: YAML reads 20260508_1502 as the integer 202605081502.
  #
  # Test: frozen once chosen, never in any fold, never used to tune anything.
  # 20261110_131211: real use of the system (interface on, hands), all classes;
  # 125 frames chosen in labeling/2026-11-12-defense.json, reviewed by hand.
  # 20261112_141201: 5-min real-use session recorded for the two classes the
  # first one lacks (stick_wooden, smallest_to_largest); 20 frames picked by eye.
  test_sessions: ["20261110_131211", "20261112_141201"]
  untimed_to: train            # images with no session (predict_NNNNNN): always train
  # Group k-fold, k = 5 (see src/vision_model/folds.py): fold k validates on its
  # sessions and trains on all the others except test. Groups balanced by image
  # count (2026-11-12): ~45-80 images each. "untimed" (173 old images from
  # unknown sessions) is never validated on: it may share capture days with
  # the named sessions.
  folds:
    - ["20260423_1414"]                                       # 80 images, 31 classes
    - ["20261109_184859"]                                     # 75 images, real use
    - ["rf_20260604"]                                         # 61 images, 22 classes
    - ["20260515_1958", "20260423_1552", "20260423_1637"]     # 56 images
    - ["20260508_1502", "rf_20260611"]                        # 45 images

cv:
  max_folds: null              # null = all folds; 1 = only fold 1 (quick experiments)

train:
  # Baseline = Ultralytics defaults except flips (they turn digits and arrows
  # into other symbols without changing the label).
  model: yolo11s.pt
  imgsz: 1280                  # symbols are small in the 1920x1080 bird view
  epochs: 150                  # max per fold; the final model uses the folds' mean best epoch
  patience: 30                 # early stopping on each fold's val
  batch: 8
  seed: 42
  deterministic: true
  device: "0"                  # "0" = first CUDA GPU, "cpu" otherwise
  workers: 4
  cos_lr: false
  fliplr: 0.0
  flipud: 0.0
  degrees: 0.0
  hsv_h: 0.015                 # keep low: several classes differ only by color
  hsv_s: 0.7
  hsv_v: 0.4
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0

runtime:
  # Workarounds for a given machine/driver; they do not change the model, only
  # which kernels compute it.
  # PyTorch ROCm 7.2.1 on Windows (AMD Radeon): MIOpen's BatchNorm crashes during
  # training (ROCm/TheRock#9206). true = PyTorch's native BatchNorm. Slower.
  native_batchnorm: false

export:
  format: onnx
  dynamic: false
  simplify: true
