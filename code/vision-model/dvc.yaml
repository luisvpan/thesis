stages:
  prepare:
    cmd: uv run --no-sync vm-prepare
    deps:
      - data/raw
      - src/vision_model/prepare.py
      - src/vision_model/raw.py
      - src/vision_model/sessions.py
    params:
      - data
      - split
    outs:
      - data/prepared

  train:
    cmd: uv run --no-sync vm-train
    deps:
      - data/prepared
      - src/vision_model/train.py
    params:
      - train
      - runtime
    outs:
      - dvclive/artifacts        # best.pt, DVC-cached (not in git)
      - dvclive/plots/images     # Ultralytics PNGs, DVC-cached
    metrics:
      - dvclive/metrics.json:
          cache: false           # small, versioned in git
    plots:
      - dvclive/plots/metrics:
          cache: false           # per-epoch curves (.tsv), versioned in git
          x: step
      - dvclive/plots/sklearn/cf.json:
          cache: false
          template: confusion_normalized
          x: actual
          y: predicted

  evaluate:
    cmd: uv run --no-sync vm-evaluate
    deps:
      - dvclive/artifacts
      - data/prepared
      - src/vision_model/evaluate.py
    params:
      - train.imgsz
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/per_class.csv:
          cache: false
          template: bar_horizontal
          x: ap50_95
          y: class
    outs:
      - reports/confusion_matrix.json:
          cache: false

  export:
    cmd: uv run --no-sync vm-export
    deps:
      - dvclive/artifacts
      - reports/metrics.json
      - src/vision_model/export.py
    params:
      - export
      - train.imgsz
      - train.model
    outs:
      - models/export
