[project]
name = "cv-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "DaikoneKisu", email = "eduardoarzolay@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "openni>=2.3.0",
    "pydantic>=2.0.0",
    "opencv-python>=4.0.0",
    "numpy>=2.0.0",
]

[project.scripts]
cv-system = "cv_system.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
