[project]
name = "cv-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "DaikoneKisu", email = "eduardoarzolay@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "openni>=2.3.0",
  "pydantic>=2.0.0",
  "opencv-python>=4.0.0",
  "numpy>=2.0.0",
  "python-dotenv>=1.2.2",
  "websockets>=12.0",
  "scipy>=1.17.1",
  "mediapipe>=0.10.33",
  "ultralytics>=8.0.0",
  "onnxruntime-directml>=1.24.4",
  "lap>=0.5.13",
]

[project.scripts]
cv-system = "cv_system.main:main"

[project.optional-dependencies]
export = ["onnx>=1.21.0", "onnxruntime>=1.24.4", "onnxslim>=0.1.91"]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0", "ruff>=0.15.7"]
