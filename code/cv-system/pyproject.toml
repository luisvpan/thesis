[project]
name = "cv-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "DaikoneKisu", email = "eduardoarzolay@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openni>=2.3.0",
  "pydantic>=2.0.0",
  "opencv-python>=4.0.0",
  "numpy>=2.0.0",
  "python-dotenv>=1.2.2",
  "websockets>=12.0",
  "scipy>=1.17.1",
  "mediapipe>=0.10.33",
  "ultralytics>=8.0.0",
  "onnxruntime-directml>=1.24.4",
  "lap>=0.5.13",
  "supervision>=0.27.0.post2",
  "roboflow>=1.3.7",
  "pykinect2",
  "scikit-learn>=1.8.0",
]

[project.scripts]
cv-system = "cv_system.main:main"
cv-ide-relay = "cv_system.bridge.ide_relay_server:run"
cv-stack = "cv_system.launch_stack:main"
capture = "cv_system.capture:main"
predict = "cv_system.predict:main"
upload-roboflow = "cv_system.upload_to_roboflow:main"

[project.optional-dependencies]
export = ["onnx>=1.21.0", "onnxruntime>=1.24.4", "onnxslim>=0.1.91"]
# AMD/Intel/NVIDIA on Windows via DirectX 12 (pip install torch-directml torchvision)
directml = ["torch-directml>=0.2.5.dev240914", "torchvision>=0.19.1"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0", "ruff>=0.15.7"]

[tool.uv.sources]
pykinect2 = { path = "../pykinect2", editable = true }
