[project]
name = "thesis-code"
version = "0.1.0"
description = "Code for our thesis project, forked from anthxnyR/MagicboARd"
requires-python = ">=3.12"
dependencies = [
  "mediapipe>=0.10.21",
  "numpy>=1.26.4",
  "opencv-python>=4.11.0.86",
  "openni>=2.3.0",
  "pygame>=2.6.1",
  "pysimplegui>=5.0.8.3",
  "scikit-image>=0.25.2",
  "tqdm>=4.67.1",
]

[tool.uv.sources]
pysimplegui = { index = "pysimplegui-index" }

[[tool.uv.index]]
name = "pysimplegui-index"
url = "https://PySimpleGUI.net/install"
explicit = true
