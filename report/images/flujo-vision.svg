<text x="300.0" y="595.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">Construir transformadores</text>
<text x="300.0" y="610.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">y detectores</text>
<rect x="196.6" y="654.8" width="206.8" height="44.0" fill="#f7f7f5" stroke="#1f1f1f"/>
