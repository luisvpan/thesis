<text x="300.0" y="330.9" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">¿Hay calibración</text>
<text x="300.0" y="345.9" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">guardada válida?</text>
