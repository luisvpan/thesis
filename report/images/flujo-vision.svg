<text x="300.0" y="424.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">Proyectar la rejilla de marcadores</text>
<text x="300.0" y="439.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">y detectarlos en la imagen de color</text>
