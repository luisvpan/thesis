<text x="300.0" y="688.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">del servidor de relevo</text>
<rect x="196.6" y="732.8" width="206.8" height="44.0" fill="#f7f7f5" stroke="#1f1f1f"/>
<text x="300.0" y="751.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">Capturar color, profundidad</text>
<text x="300.0" y="766.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">e infrarrojo</text>
<rect x="203.2" y="810.8" width="193.6" height="44.0" fill="#f7f7f5" stroke="#1f1f1f"/>
<text x="300.0" y="829.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">Detectar cartas (YOLO)</text>
<text x="300.0" y="844.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">y enviar el lote por HTTP</text>
<rect x="203.2" y="888.8" width="193.6" height="44.0" fill="#f7f7f5" stroke="#1f1f1f"/>
<text x="300.0" y="907.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">Detectar toques</text>
<text x="300.0" y="922.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">y enviarlos por WebSocket</text>
