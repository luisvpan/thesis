<text x="300.0" y="502.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">Calcular las homografías y el mapa</text>
<text x="300.0" y="517.3" font-family="DejaVu Sans Mono" font-size="11" text-anchor="middle" fill="#1f1f1f">de fondo; guardarlos si se definió</text>
